[pytest]
DJANGO_SETTINGS_MODULE = tests.settings_test
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --no-header
# Run: TEST_DB_PASSWORD=postgres uv run pytest tests/
# First run (or after model changes): add --create-db to recreate the test DB
