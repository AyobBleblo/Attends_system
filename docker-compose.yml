version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-attendance_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    # ── PostgreSQL performance tuning for 12-core / 4GB VM ──────────────
    command:
      - "postgres"
      - "-c" 
      - "max_connections=200"
      - "-c"
      - "shared_buffers=1GB"
      - "-c"
      - "effective_cache_size=3GB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=256MB"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "checkpoint_completion_target=0.9"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '1.0'
          memory: 512M
    networks:
      - app_network

  backend:
    build: ./backend
    restart: always
    environment:
      - DEBUG=False
      - DB_HOST=db
      - DB_NAME=${DB_NAME:-attendance_db}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_PORT=5432
      - SECRET_KEY=${SECRET_KEY:-fallback-secret-key-change-in-production}
      - ALLOWED_HOSTS=*
      - USE_FAST_HASHER=True
    depends_on:
      - db
    volumes:
      - static_volume:/app/staticfiles
    deploy:
      resources:
        limits:
          cpus: '10.0'
          memory: 4096M
        reservations:
          cpus: '4.0'
          memory: 1024M
    networks:
      - app_network

  frontend:
    build: ./frontend
    restart: always
    ports:
      - "8080:80"    # HTTP  → nginx redirects to HTTPS automatically
      - "443:443"    # HTTPS → camera / getUserMedia works on any device
    depends_on:
      - backend
    volumes:
      - static_volume:/app/staticfiles:ro
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 1024M
        reservations:
          cpus: '1.0'
          memory: 256M
    networks:
      - app_network

volumes:
  postgres_data:
  static_volume:

networks:
  app_network:
