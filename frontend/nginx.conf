# ─────────────────────────────────────────────────────────────────────────────
# Nginx — optimised for 1000+ concurrent connections / 8-core burst traffic
# ─────────────────────────────────────────────────────────────────────────────

# auto → spawns one worker per CPU core visible to the container (up to 2).
# Nginx is event-driven so 2 workers × 10,000 conn = 20,000 simultaneous
# connections, far more than our 1000-user burst needs.
worker_processes auto;

# Raise the per-worker file-descriptor ceiling.
# Default is 1024; 65535 ensures we never hit EMFILE during a 1000-conn burst.
worker_rlimit_nofile 65535;

events {
    # Per-worker simultaneous connection limit.
    # 10,000 × 2 workers = 20,000 total. Well above our 1000-user burst.
    worker_connections 10000;

    # Accept ALL pending connections in one syscall instead of one-by-one.
    # Critical during a burst where 1000 SYNs arrive within 3 seconds.
    multi_accept on;

    # epoll is the Linux kernel's most efficient I/O notification mechanism.
    # It scales to tens of thousands of file descriptors with O(1) overhead.
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Performance ──────────────────────────────────────────────────────────────────
    sendfile           on;   # Serve static files via zero-copy kernel path
    tcp_nopush         on;   # Batch TCP packets; reduces ACK round-trips
    tcp_nodelay        on;   # Disable Nagle algorithm for low-latency responses

    # How long Nginx holds an idle client connection open.
    # MUST match --keep-alive in Gunicorn (75s) so both ends agree on
    # connection lifecycle. Mismatch → 502 "upstream prematurely closed" errors.
    keepalive_timeout  75;

    # Max requests per persistent connection before Nginx forces a reconnect.
    # High value reduces connection-setup overhead during sustained load.
    keepalive_requests 10000;

    types_hash_max_size 2048;

    # ── Logging ────────────────────────────────────────────────────────────────
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 4;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    # ── Upstream: Gunicorn backend ────────────────────────────────────────────────────
    upstream django_backend {
        server backend:8000;

        # keepalive = number of IDLE persistent connections Nginx keeps open
        # to Gunicorn in its connection pool PER WORKER PROCESS.
        # Formula: Gunicorn_threads / Nginx_workers = 81 / 2 ≈ 40 → use 64.
        # This means during a 1000-req burst, Nginx reuses existing TCP
        # sockets to Gunicorn instead of paying the 3-way handshake cost
        # for every single request. Massively reduces latency under burst.
        keepalive 64;

        # If Gunicorn returns 502/503/504 or a connection error,
        # retry the request on the next available upstream (future-proofing
        # for multi-worker deployments; harmless with a single upstream).
        # keepalive_requests controls how many requests one pooled connection
        # is reused for before it is closed and recycled.
        keepalive_requests 1000;
        keepalive_timeout  75s;
    }

    # ── HTTP → HTTPS redirect ──────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS (TLS) server ─────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name _;

        # Self-signed certificate (generated at Docker build time)
        ssl_certificate     /etc/nginx/ssl/selfsigned.crt;
        ssl_certificate_key /etc/nginx/ssl/selfsigned.key;

        # Modern TLS settings
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # ── Proxy buffer tuning (handles large JWT headers + JSON payloads) ────
        proxy_buffer_size       128k;
        proxy_buffers           4 256k;
        proxy_busy_buffers_size 256k;

        # ── React SPA ──────────────────────────────────────────────────────────
        location / {
            root  /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # ── Django REST API ────────────────────────────────────────────────────────────────
        location /api/ {
            proxy_pass         http://django_backend;

            # HTTP/1.1 + empty Connection header = persistent (keepalive) proxying.
            # Without this, Nginx uses HTTP/1.0 and closes the socket after each
            # request, destroying the upstream connection pool we just built.
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Fail fast. If Gunicorn hasn't responded in 30s, something is
            # genuinely broken. 120s just queues more requests behind a stuck worker.
            proxy_connect_timeout  10s;
            proxy_send_timeout     30s;
            proxy_read_timeout     30s;

            # On connection error or timeout, try the request again rather than
            # immediately returning a 5xx to the client.
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }

        # ── Django Admin ───────────────────────────────────────────────────────
        location /admin/ {
            proxy_pass         http://django_backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout 120s;
            proxy_send_timeout    120s;
            proxy_read_timeout    120s;
        }

        # ── Django Static Files ────────────────────────────────────────────────
        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            proxy_connect_timeout 120s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
            fastcgi_read_timeout 120s;
        }
    }
}
